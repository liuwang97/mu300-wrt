name: Tests

# Each tree's tests on its own (kernel/tests, openwrt/tests), and the rules that keep the repository in shape: the two
# trees never read each other's files (tools/check-boundary), and the documentation stays a reference (tools/doc-lint).
# Locally: cd kernel/tests && python3 -m unittest; the same in openwrt/tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-boundary
      - run: sh tools/doc-lint

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shells and lz4
        run: |
          sudo apt-get install -y -qq busybox lz4 cpio >/dev/null
          python3 -m pip install -q lz4 || python3 -m pip install -q --break-system-packages lz4
      - name: tests
        env:
          MU300_TEST_SHELLS: busybox sh
        run: cd kernel/tests && python3 -m unittest

  openwrt:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]          # openwrt/tests/shard.py: round-robin, the heavy modules spread by hand
    runs-on: ubuntu-latest
    name: openwrt shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4     # the control panel's JavaScript tests
        with:
          node-version: 22
      - name: shells and tools
        run: sudo apt-get install -y -qq busybox lz4 cpio jq >/dev/null
      - name: the driver strips the firmware SAE PMK record, with UBSan
        if: matrix.shard == 0
        env:
          MU300_TEST_UBSAN: '1'
        run: cd openwrt/tests && python3 -m unittest test_wpa2_only -v
      - name: tests
        # OpenWrt runs every script under busybox ash
        env:
          MU300_TEST_SHELLS: busybox sh
        run: |
          cd openwrt/tests
          mods=$(python3 shard.py 3 ${{ matrix.shard }}); echo "shard ${{ matrix.shard }}: $mods"
          python3 -m unittest $mods

  # the name a branch ruleset can require: green only when every job is
  all:
    needs: [rules, kernel, openwrt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rules.result }}" = success && test "${{ needs.kernel.result }}" = success && test "${{ needs.openwrt.result }}" = success
