name: Release

# The whole release on a GitHub arm64 runner: Linux (kernel/VERSION) with its modules (kernel/build.sh,
# build-modules.sh), then tools/make-release.sh, which builds the kernel bundle and the OpenWrt image, audits both
# and publishes the release. Actions > Release > Run workflow on main, with the tag left empty (the next one of
# today: vYYYY.MM.DD.N, tools/make-release.sh --next-tag) or given (then it must be of today, in that form): a
# prerelease by default, which mu300-update does not offer until the maintainer has tried it on a device and
# promoted it on GitHub (gh release edit TAG --prerelease=false --latest). The release's commit is the main commit
# the workflow ran on: the job refuses another ref, and a tag or release that already exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag: empty for the next one of today (vYYYY.MM.DD.N), or that tag of today'
        required: false
        default: ''
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: write   # the release and its assets
    env:
      INPUT_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      MU300_REPO: ${{ github.repository }}
    steps:
      - name: Ref
        run: '[ "$GITHUB_REF_NAME" = main ] || { echo "releases come from main, not $GITHUB_REF_NAME"; exit 1; }'
      - uses: actions/checkout@v5
      # the tag: the next one of today when none was given; a given one must be vYYYY.MM.DD.N of today. Checked here,
      # at the start: the build takes long, and make-release.sh is told below that its day may have passed by then
      - name: Tag
        run: |
          TAG=$INPUT_TAG
          [ -n "$TAG" ] || TAG=$(sh tools/make-release.sh --next-tag)
          sh tools/make-release.sh --check-tag "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "release $TAG from $GITHUB_REF_NAME@$GITHUB_SHA"
      - name: Not yet released
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release $TAG exists"; exit 1; fi
          [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ] || { echo "tag $TAG exists"; exit 1; }
      # Everything that uses docker runs as root: on a Linux docker the containers write their outputs as root, and
      # the scripts' own cleanups of what a container filled fail for anyone else.
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 cpio zstd >/dev/null
          sudo python3 -m pip install -q lz4 || sudo python3 -m pip install -q --break-system-packages lz4
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          docker version --format 'docker {{.Server.Version}} {{.Server.Arch}}'
          df -h / | tail -1
      # The kernel outputs are kept in the Actions cache by the tree they were built from: a release whose kernel
      # inputs did not change skips the build.
      - name: Kernel tree
        id: kv
        run: echo "tree=$(git rev-parse HEAD:kernel)" >> "$GITHUB_OUTPUT"
      - name: Kernel outputs from the cache
        id: ck
        uses: actions/cache/restore@v4
        with:
          path: kernel/out
          key: kernel-${{ steps.kv.outputs.tree }}
      - name: Kernel and modules
        if: steps.ck.outputs.cache-hit != 'true'
        run: |
          sudo -E docker build -t mu300-kbuild kernel/
          sudo -E docker volume create mu300-src
          sudo -E docker run --rm -v mu300-src:/src -v "$PWD":/repo mu300-kbuild bash /repo/kernel/build.sh
          sudo -E docker run --rm -v mu300-src:/src -v "$PWD":/repo mu300-kbuild bash /repo/kernel/build-modules.sh > /dev/null
          ls kernel/out/modules/*.ko | wc -l
      - if: steps.ck.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel/out
          key: kernel-${{ steps.kv.outputs.tree }}
      - name: Build logs
        if: failure()
        run: tail -n 60 kernel/out/modules/*.log 2>/dev/null || true
      # MU300_RELEASE_KEY: the release key (a usign secret key, see tools/sign-release.sh). With it make-release.sh
      # signs SHA256SUMS and publishes SHA256SUMS.sig; when the tree has the public key
      # (openwrt/opt/mu300/lib/release.pub), nothing is published unsigned.
      - name: Bundle, image, audit, sign, publish
        env:
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          MU300_RELEASE_KEY: ${{ secrets.MU300_RELEASE_KEY }}
        run: |
          pre=; [ "$INPUT_PRERELEASE" != true ] || pre=--prerelease
          # the build outputs are ignored by git, so the tree is still the commit the release says it is
          sudo -E git status --porcelain
          sudo -E sh tools/make-release.sh "$TAG" --publish --any-date $pre
