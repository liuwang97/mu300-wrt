name: Kernel build

# Builds kernel/ (Linux 7.2 with the port, the patches and every out-of-tree module) for the version in kernel/VERSION
# and for the newest 7.2.y on kernel.org, every week and on changes to kernel/. The build stops on anything that drifts
# silently - a patch that no longer applies, a config option Kconfig drops, a port edit whose anchor moved, an API a
# module uses that is gone - so a red run on the newest 7.2.y is the warning before kernel/VERSION moves to it.

on:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [main]
    paths: ['kernel/**', '.github/workflows/mainline.yml']
  workflow_dispatch:
    inputs:
      kv:
        description: 'Kernel version to build (empty: kernel/VERSION and the newest 7.2.y)'
        required: false

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          KV_INPUT: ${{ github.event.inputs.kv }}
        run: |
          if [ -n "$KV_INPUT" ]; then
            echo "$KV_INPUT" | grep -Eq '^7\.2(\.[0-9]+)?$' || { echo "not a 7.2 kernel: $KV_INPUT"; exit 1; }
            echo "list=[\"$KV_INPUT\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pinned=$(cat kernel/VERSION)
          curl -fsSL https://www.kernel.org/releases.json | PINNED="$pinned" python3 -c '
          import json, os, re, sys
          vs = [x["version"] for x in json.load(sys.stdin)["releases"] if re.fullmatch(r"7\.2(\.[0-9]+)?", x["version"])]
          newest = sorted(vs, key=lambda v: [int(p) for p in v.split(".")])[-1:]
          print("list=" + json.dumps(sorted({os.environ["PINNED"], *newest})))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        kv: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build environment
        run: docker build -t mu300-kbuild kernel/
      - name: Kernel ${{ matrix.kv }}
        env:
          KV: ${{ matrix.kv }}
        run: |
          docker volume create mu300-src
          docker run --rm -e KV="$KV" -v mu300-src:/src -v "$PWD":/repo mu300-kbuild bash /repo/kernel/build.sh
      - name: Out-of-tree modules
        env:
          KV: ${{ matrix.kv }}
        run: |
          docker run --rm -e KV="$KV" -v mu300-src:/src -v "$PWD":/repo mu300-kbuild bash /repo/kernel/build-modules.sh > /dev/null
          ls kernel/out/modules/*.ko | wc -l
      # every module of the boards is built (all-modules.py): the tree and its objects take ~7 GB
      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          sudo du -sh /var/lib/docker/volumes/mu300-src 2>/dev/null || docker system df
      - name: Build logs
        if: failure()
        run: tail -n 60 kernel/out/modules/*.log 2>/dev/null || true
