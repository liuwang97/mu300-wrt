# On-demand module loading (FINDINGS 130). The kernel runs this helper for every module it loads by itself; it
# refuses the rarely used protocol families and filesystems of /opt/mu300/lib/autoload-blocked, which any user could
# otherwise have loaded with a socket() or a mount attempt. Root loads them deliberately with `modprobe NAME`.
kernel.modprobe = /opt/mu300/bin/mu300-modprobe-guard
# line disciplines (n_hdlc, slcan, ...) load on demand for root only
dev.tty.ldisc_autoload = 0
