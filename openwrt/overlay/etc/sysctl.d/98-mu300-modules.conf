# On-demand module loading: any user can make the kernel load a module (a socket of its family is enough), so line
# disciplines (n_hdlc, slcan, ...) load on demand for root only. The kernel's module helper becomes
# /opt/mu300/bin/mu300-modprobe-guard once its table is made (init.d/mu300-hw).
dev.tty.ldisc_autoload = 0
